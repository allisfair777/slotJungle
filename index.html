<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Slot Jungle: Temple Riches</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #050d07;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
            font-family: Arial, sans-serif;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 800px;
            max-height: 600px;
            aspect-ratio: 800 / 600;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border-radius: 30px;
            overflow: hidden;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 30px;
        }
    </style>
</head>
<body>

    <!-- Audio Elements -->
    <audio id="track0" src="jungle_beat1.mp3" loop></audio>
    <audio id="track1" src="jungle_beat2.mp3" loop></audio>
    <audio id="rainforestSound" src="rainforest.mp3" loop></audio>
    <audio id="spinSound" src="spin.wav"></audio>
    <audio id="winSound" src="win.wav"></audio>
    <audio id="clickSound" src="click.wav"></audio>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Load Images
        const bgImg = new Image(); bgImg.src = "casino_background.png";
        const shibaImg = new Image(); shibaImg.src = "shiba.png";
        const tigerImg = new Image(); tigerImg.src = "tiger.png";
        const parrotImg = new Image(); parrotImg.src = "parrot.png";
        const monkeyImg = new Image(); monkeyImg.src = "monkey.png";
        const jungleImg = new Image(); jungleImg.src = "jungle.png";
        const speakerImg = new Image(); speakerImg.src = "speaker.png";
        const muteImg = new Image(); muteImg.src = "mute.png";

        const symbols = ["Shiba", "Tiger", "Parrot", "Monkey", "Jungle"];
        const symbolImages = {
            "Shiba": shibaImg,
            "Tiger": tigerImg,
            "Parrot": parrotImg,
            "Monkey": monkeyImg,
            "Jungle": jungleImg
        };

        const SOFT_GOLD = "#d4a373";
        const DARK_BROWN = "#1a0a00";
        const WHITE = "#ffffff";

        let balance = 100000;
        let highscore = parseInt(localStorage.getItem("jungle_highscore")) || 100000;
        
        const betSteps = [1000, 5000, 10000, 25000];
        let betIndex = 0;
        let currentBet = betSteps[betIndex];
        let isBetAllActive = false;
        
        // Independent Audio Control System
        let musicMuted = true;
        let musicVolume = 0.3;
        let sfxMuted = false;
        let sfxVolume = 0.5;

        // Music Playlist & Dropdown State
        const soundtracks = [document.getElementById("track0"), document.getElementById("track1")];
        const trackNames = ["Jungle Beats Vol. 1", "Rainforest Rhythms"];
        let currentTrackIndex = 0;
        let musicPlaying = false;
        let playlistDropdownOpen = false;

        const timeModes = ["Day", "Night", "Both"];
        let timeModeIndex = 0;

        let reels = ["Shiba", "Tiger", "Parrot"];
        let spinning = false;
        let isGameOver = false;

        let bannerText = "";
        let bannerAlpha = 0;
        let flowerParticles = [];
        let screenShakeTimer = 0;
        let screenShakeIntensity = 0;

        // Hazard & Stone Projectile State
        let activeHazard = null; // { type: 'jaguar' | 'vine', x: 400, y: 165 }
        let hazardActive = false;
        let stoneProjectile = null; // { x, y, targetX, targetY, progress }

        // Environment visuals
        let stars = [];
        for (let i = 0; i < 40; i++) {
            stars.push({ x: Math.random() * 800, y: Math.random() * 220, size: Math.random() * 2 + 1, alpha: Math.random(), speed: Math.random() * 0.03 + 0.01 });
        }
        let fireflies = [];
        for (let i = 0; i < 15; i++) {
            fireflies.push({ x: Math.random() * 800, y: Math.random() * 400 + 150, vx: (Math.random() - 0.5) * 0.5, vy: (Math.random() - 0.5) * 0.5, alpha: Math.random() });
        }

        // Layout Rectangles (Clean Spacing)
        const logoRect = { x: 25, y: 15, w: 55, h: 55 };
        const payoutOvalRect = { x: 25, y: 295, w: 365, h: 140 };
        const betSliderOvalRect = { x: 410, y: 295, w: 365, h: 140 };
        const spinPlankRect = { x: 550, y: 455, w: 225, h: 65 };
        const restartWheelRect = { x: 25, y: 455, w: 65, h: 65 };
        
        // Independent Controls (Top Right)
        const musicMuteRect = { x: 550, y: 18, w: 35, h: 35 };
        const musicSliderRect = { x: 595, y: 28, w: 80, h: 16 };
        const sfxMuteRect = { x: 690, y: 18, w: 35, h: 35 };
        const sfxSliderRect = { x: 735, y: 28, w: 55, h: 16 };

        const timeToggleRect = { x: 630, y: 65, w: 160, h: 32 };
        const playlistDropdownRect = { x: 630, y: 105, w: 160, h: 32 };

        // Tactical Defense Controls (Slot Pirates Style Cannons & Swords)
        const leftSwordRect = { x: 330, y: 455, w: 55, h: 65 };
        const rightSwordRect = { x: 395, y: 455, w: 55, h: 65 };
        const slingshotCannonRect = { x: 460, y: 455, w: 80, h: 65 };

        function updateAudioVolumes() {
            soundtracks.forEach((track, idx) => {
                if (track) track.volume = (musicMuted || idx !== currentTrackIndex || !musicPlaying) ? 0 : musicVolume;
            });
            let rainforest = document.getElementById("rainforestSound");
            if (rainforest) rainforest.volume = musicMuted ? 0 : musicVolume * 0.5;

            let sfxList = [document.getElementById("spinSound"), document.getElementById("winSound"), document.getElementById("clickSound")];
            sfxList.forEach(sfx => {
                if (sfx) sfx.volume = sfxMuted ? 0 : sfxVolume;
            });
        }

        function playSound(soundObj) {
            if (!sfxMuted && soundObj && soundObj.src) {
                soundObj.currentTime = 0;
                soundObj.volume = sfxVolume;
                soundObj.play().catch(e => {});
            }
        }

        function triggerScreenShake(durationMs = 300, intensity = 8) {
            screenShakeTimer = durationMs;
            screenShakeIntensity = intensity;
        }

        class FlowerParticle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 4;
                this.vy = -(Math.random() * 3 + 1);
                this.rot = Math.random() * Math.PI;
                this.vRot = (Math.random() - 0.5) * 0.1;
                this.alpha = 1.0;
                this.life = 100;
                let colors = ["#ff70a6", "#ff9770", "#ffd670", "#e9ff70", "#70d6ff"];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.size = Math.random() * 5 + 4;
            }
            update(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                this.vy += 0.05;
                this.rot += this.vRot;
                this.life -= dt;
                this.alpha = Math.max(0, this.life / 100);
            }
            draw() {
                if (this.alpha <= 0) return;
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rot);
                ctx.fillStyle = this.color;
                for (let i = 0; i < 4; i++) {
                    ctx.beginPath();
                    ctx.ellipse(0, this.size, this.size * 0.5, this.size, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.rotate(Math.PI / 2);
                }
                ctx.restore();
            }
        }

        function drawOutlinedText(text, x, y, font, fillColor, outlineColor = DARK_BROWN, align = "center") {
            ctx.save();
            ctx.font = font;
            ctx.textAlign = align;
            ctx.textBaseline = "middle";
            ctx.lineWidth = 4;
            ctx.strokeStyle = outlineColor;
            ctx.strokeText(text, x, y);
            ctx.fillStyle = fillColor;
            ctx.fillText(text, x, y);
            ctx.restore();
        }

        function getBetArcNodes() {
            let startX = betSliderOvalRect.x + 35;
            let endX = betSliderOvalRect.x + betSliderOvalRect.w - 50;
            let startY = betSliderOvalRect.y + 98;
            let endY = betSliderOvalRect.y + 28;

            let nodes = [];
            for (let i = 0; i < 5; i++) {
                let t = i / 4;
                let x = startX + t * (endX - startX);
                let linearY = startY + t * (endY - startY);
                let arcLift = Math.sin(t * Math.PI) * 14;
                let y = linearY - arcLift;
                nodes.push({ x, y });
            }
            return nodes;
        }

        function drawEnvironmentOverlay() {
            let mode = timeModes[timeModeIndex];
            let isNight = mode === "Night" || (mode === "Both" && Math.floor(Date.now() / 8000) % 2 === 1);

            if (isNight) {
                let skyGrad = ctx.createLinearGradient(0, 0, 0, 300);
                skyGrad.addColorStop(0, "rgba(5, 12, 35, 0.75)");
                skyGrad.addColorStop(1, "rgba(10, 30, 20, 0.4)");
                ctx.fillStyle = skyGrad;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                stars.forEach(s => {
                    s.alpha += s.speed;
                    if (s.alpha > 1 || s.alpha < 0) s.speed = -s.speed;
                    ctx.fillStyle = `rgba(255, 255, 220, ${Math.abs(s.alpha)})`;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                    ctx.fill();
                });

                fireflies.forEach(f => {
                    f.x += f.vx; f.y += f.vy;
                    if (f.x < 0 || f.x > 800) f.vx = -f.vx;
                    if (f.y < 150 || f.y > 550) f.vy = -f.vy;
                    ctx.fillStyle = "rgba(180, 255, 100, 0.8)";
                    ctx.beginPath(); ctx.arc(f.x, f.y, 2.5, 0, Math.PI * 2); ctx.fill();
                });
            }
        }

        function drawHazardAndDefenseGraphics() {
            if (!hazardActive || !activeHazard) return;
            ctx.save();

            let cx = activeHazard.x, cy = activeHazard.y;
            if (activeHazard.type === 'jaguar') {
                ctx.fillStyle = "#ffcc00";
                ctx.shadowColor = "#ff3300";
                ctx.shadowBlur = 15;
                ctx.beginPath(); ctx.arc(cx - 35, cy, 12, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(cx + 35, cy, 12, 0, Math.PI * 2); ctx.fill();
                drawOutlinedText("⚠️ ROGUE JAGUAR ATTACK!", cx, cy - 25, "16px Arial bold", "#ff4d4d");
            } else if (activeHazard.type === 'vine') {
                ctx.strokeStyle = "#4dff4d";
                ctx.lineWidth = 8;
                ctx.beginPath();
                ctx.moveTo(cx - 160, cy + 20); ctx.quadraticCurveTo(cx, cy - 40, cx + 160, cy + 20);
                ctx.stroke();
                drawOutlinedText("⚠️ VENOM VINE WRAP!", cx, cy - 25, "16px Arial bold", "#4dff4d");
            }

            // Render Stone Projectile if flying
            if (stoneProjectile) {
                stoneProjectile.progress += 0.05;
                let curX = stoneProjectile.startX + (stoneProjectile.targetX - stoneProjectile.startX) * stoneProjectile.progress;
                let curY = stoneProjectile.startY + (stoneProjectile.targetY - stoneProjectile.startY) * stoneProjectile.progress - Math.sin(stoneProjectile.progress * Math.PI) * 50;
                
                ctx.fillStyle = "#cccccc";
                ctx.strokeStyle = "#333333";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(curX, curY, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                if (stoneProjectile.progress >= 1.0) {
                    stoneProjectile = null;
                    hazardActive = false;
                    activeHazard = null;
                    bannerText = "DEFENDED! HAZARD DESTROYED!";
                    bannerAlpha = 2.0;
                }
            }

            // Tactical Defense Controls (Swords & Cannon)
            ctx.fillStyle = "#2d6a4f";
            ctx.strokeStyle = SOFT_GOLD;
            ctx.lineWidth = 2;
            
            // Left Sword
            ctx.beginPath(); ctx.roundRect(leftSwordRect.x, leftSwordRect.y, leftSwordRect.w, leftSwordRect.h, 12); ctx.fill(); ctx.stroke();
            drawOutlinedText("⚔️ L-SWORD", leftSwordRect.x + 27, leftSwordRect.y + 32, "11px Arial bold", SOFT_GOLD);

            // Right Sword
            ctx.beginPath(); ctx.roundRect(rightSwordRect.x, rightSwordRect.y, rightSwordRect.w, rightSwordRect.h, 12); ctx.fill(); ctx.stroke();
            drawOutlinedText("⚔️ R-SWORD", rightSwordRect.x + 27, rightSwordRect.y + 32, "11px Arial bold", SOFT_GOLD);

            // Cannon / Slingshot Turret
            ctx.fillStyle = "#8b4513";
            ctx.beginPath(); ctx.roundRect(slingshotCannonRect.x, slingshotCannonRect.y, slingshotCannonRect.w, slingshotCannonRect.h, 12); ctx.fill(); ctx.stroke();
            drawOutlinedText("💣 CANNON", slingshotCannonRect.x + 40, slingshotCannonRect.y + 32, "12px Arial bold", SOFT_GOLD);

            ctx.restore();
        }

        function drawPayoutOval() {
            ctx.save();
            ctx.fillStyle = "rgba(26, 10, 0, 0.82)";
            ctx.strokeStyle = SOFT_GOLD;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(payoutOvalRect.x, payoutOvalRect.y, payoutOvalRect.w, payoutOvalRect.h, 30);
            ctx.fill();
            ctx.stroke();

            drawOutlinedText("Treasures", payoutOvalRect.x + 95, payoutOvalRect.y + 18, "15px Arial bold", SOFT_GOLD);
            drawOutlinedText("Hazards", payoutOvalRect.x + 270, payoutOvalRect.y + 18, "15px Arial bold", SOFT_GOLD);

            let rowY = [payoutOvalRect.y + 42, payoutOvalRect.y + 66, payoutOvalRect.y + 90, payoutOvalRect.y + 114];

            ctx.drawImage(shibaImg, payoutOvalRect.x + 20, rowY[0] - 10, 20, 20);
            drawOutlinedText(`$${(currentBet*50).toLocaleString()}`, payoutOvalRect.x + 85, rowY[0], "11px Arial bold", WHITE, DARK_BROWN, "left");

            ctx.drawImage(monkeyImg, payoutOvalRect.x + 20, rowY[1] - 10, 20, 20);
            drawOutlinedText(`$${(currentBet*25).toLocaleString()}`, payoutOvalRect.x + 85, rowY[1], "11px Arial bold", WHITE, DARK_BROWN, "left");

            ctx.drawImage(tigerImg, payoutOvalRect.x + 20, rowY[2] - 10, 20, 20);
            drawOutlinedText(`$${(currentBet*15).toLocaleString()}`, payoutOvalRect.x + 85, rowY[2], "11px Arial bold", WHITE, DARK_BROWN, "left");

            ctx.drawImage(parrotImg, payoutOvalRect.x + 20, rowY[3] - 10, 20, 20);
            drawOutlinedText(`$${(currentBet*10).toLocaleString()}`, payoutOvalRect.x + 85, rowY[3], "11px Arial bold", WHITE, DARK_BROWN, "left");

            let hazX = payoutOvalRect.x + 203;
            drawOutlinedText("Jaguar Trap", hazX + 25, rowY[0], "11px Arial bold", "#ff9999", DARK_BROWN, "left");
            drawOutlinedText("-1%", hazX + 130, rowY[0], "11px Arial bold", "#ff4d4d", DARK_BROWN, "right");
            drawOutlinedText("Venom Vine", hazX + 25, rowY[1], "11px Arial bold", "#ff9999", DARK_BROWN, "left");
            drawOutlinedText("-5%", hazX + 130, rowY[1], "11px Arial bold", "#ff4d4d", DARK_BROWN, "right");
            drawOutlinedText("Quicksand", hazX + 25, rowY[2], "11px Arial bold", "#ff9999", DARK_BROWN, "left");
            drawOutlinedText("-10%", hazX + 130, rowY[2], "11px Arial bold", "#ff4d4d", DARK_BROWN, "right");
            drawOutlinedText("Temple Curse", hazX + 25, rowY[3], "11px Arial bold", "#ff9999", DARK_BROWN, "left");
            drawOutlinedText("-15%", hazX + 130, rowY[3], "11px Arial bold", "#ff4d4d", DARK_BROWN, "right");

            ctx.restore();
        }

        function drawBetSliderOval() {
            ctx.save();
            ctx.fillStyle = "rgba(26, 10, 0, 0.82)";
            ctx.strokeStyle = SOFT_GOLD;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(betSliderOvalRect.x, betSliderOvalRect.y, betSliderOvalRect.w, betSliderOvalRect.h, 30);
            ctx.fill();
            ctx.stroke();

            let label = isBetAllActive ? `Bet: ALL ($${currentBet.toLocaleString()})` : `Bet: $${currentBet.toLocaleString()}`;
            drawOutlinedText(label, betSliderOvalRect.x + 180, betSliderOvalRect.y + 22, "15px Arial bold", SOFT_GOLD);

            let nodes = getBetArcNodes();
            betSteps.forEach((val, idx) => {
                let node = nodes[idx];
                let isSelected = (idx === betIndex) && !isBetAllActive;
                let displayVal = val >= 1000000 ? `$${val/1000000}M` : `$${val/1000}k`;
                drawOutlinedText(displayVal, node.x, node.y + 22, "11px Arial bold", isSelected ? SOFT_GOLD : "#aaa");

                ctx.save();
                if (!isSelected) ctx.globalAlpha = 0.5;
                ctx.drawImage(shibaImg, node.x - 14, node.y - 14, 28, 28);
                ctx.restore();
            });

            let coin = nodes[4];
            ctx.fillStyle = isBetAllActive ? "#ffd166" : "#3d3023";
            ctx.strokeStyle = isBetAllActive ? "#fff" : SOFT_GOLD;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(coin.x, coin.y, 20, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            drawOutlinedText("ALL", coin.x, coin.y, "11px Arial bold", DARK_BROWN, SOFT_GOLD);
            drawOutlinedText("Bet All", coin.x, coin.y + 26, "10px Arial bold", isBetAllActive ? SOFT_GOLD : "#aaa");

            ctx.restore();
        }

        function drawWoodenButton(rect, text, isCircle = false) {
            ctx.save();
            ctx.fillStyle = "#8b4513";
            ctx.strokeStyle = DARK_BROWN;
            ctx.lineWidth = 3;

            if (isCircle) {
                let radius = rect.w / 2;
                ctx.beginPath();
                ctx.arc(rect.x + radius, rect.y + radius, radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                drawOutlinedText(text, rect.x + radius, rect.y + radius, "13px Arial bold", SOFT_GOLD);
            } else {
                ctx.beginPath();
                ctx.roundRect(rect.x, rect.y, rect.w, rect.h, 15);
                ctx.fill();
                ctx.stroke();
                drawOutlinedText(text, rect.x + rect.w / 2, rect.y + rect.h / 2, "16px Arial bold", SOFT_GOLD);
            }
            ctx.restore();
        }

        canvas.addEventListener("pointerdown", (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) * (canvas.width / rect.width);
            const y = (e.clientY - rect.top) * (canvas.height / rect.height);

            // Playlist Dropdown Menu Interaction
            if (x >= playlistDropdownRect.x && x <= playlistDropdownRect.x + playlistDropdownRect.w && y >= playlistDropdownRect.y && y <= playlistDropdownRect.y + playlistDropdownRect.h) {
                playlistDropdownOpen = !playlistDropdownOpen;
                playSound(clickSound);
                return;
            }

            if (playlistDropdownOpen) {
                if (x >= playlistDropdownRect.x && x <= playlistDropdownRect.x + playlistDropdownRect.w && y >= playlistDropdownRect.y + 35 && y <= playlistDropdownRect.y + 35 + (trackNames.length * 35)) {
                    let clickedIdx = Math.floor((y - (playlistDropdownRect.y + 35)) / 35);
                    if (clickedIdx >= 0 && clickedIdx < soundtracks.length) {
                        soundtracks.forEach(t => { if(t) t.pause(); });
                        currentTrackIndex = clickedIdx;
                        musicPlaying = true;
                        let activeTrack = soundtracks[currentTrackIndex];
                        if (activeTrack) { activeTrack.currentTime = 0; activeTrack.play().catch(e => {}); }
                        updateAudioVolumes();
                    }
                    playlistDropdownOpen = false;
                    playSound(clickSound);
                    return;
                } else {
                    playlistDropdownOpen = false;
                }
            }

            // Time Mode Toggle
            if (x >= timeToggleRect.x && x <= timeToggleRect.x + timeToggleRect.w && y >= timeToggleRect.y && y <= timeToggleRect.y + timeToggleRect.h) {
                timeModeIndex = (timeModeIndex + 1) % timeModes.length;
                playSound(clickSound);
                return;
            }

            // Independent Music Mute Button
            if (x >= musicMuteRect.x && x <= musicMuteRect.x + musicMuteRect.w && y >= musicMuteRect.y && y <= musicMuteRect.y + musicMuteRect.h) {
                musicMuted = !musicMuted;
                if (!musicMuted && !musicPlaying) {
                    musicPlaying = true;
                    soundtracks[currentTrackIndex].play().catch(e=>{});
                }
                updateAudioVolumes();
                playSound(clickSound);
                return;
            }

            // Independent Music Volume Slider
            if (x >= musicSliderRect.x && x <= musicSliderRect.x + musicSliderRect.w && y >= musicSliderRect.y && y <= musicSliderRect.y + musicSliderRect.h) {
                musicVolume = Math.max(0, Math.min(1, (x - musicSliderRect.x) / musicSliderRect.w));
                updateAudioVolumes();
                return;
            }

            // Independent SFX Mute Button
            if (x >= sfxMuteRect.x && x <= sfxMuteRect.x + sfxMuteRect.w && y >= sfxMuteRect.y && y <= sfxMuteRect.y + sfxMuteRect.h) {
                sfxMuted = !sfxMuted;
                updateAudioVolumes();
                playSound(clickSound);
                return;
            }

            // Independent SFX Volume Slider
            if (x >= sfxSliderRect.x && x <= sfxSliderRect.x + sfxSliderRect.w && y >= sfxSliderRect.y && y <= sfxSliderRect.y + sfxSliderRect.h) {
                sfxVolume = Math.max(0, Math.min(1, (x - sfxSliderRect.x) / sfxSliderRect.w));
                updateAudioVolumes();
                playSound(clickSound);
                return;
            }

            // Hazard Defense Click (Fires Stone Projectile towards Hazard)
            if (hazardActive && activeHazard) {
                if ((x >= leftSwordRect.x && x <= leftSwordRect.x + leftSwordRect.w && y >= leftSwordRect.y && y <= leftSwordRect.y + leftSwordRect.h) ||
                    (x >= rightSwordRect.x && x <= rightSwordRect.x + rightSwordRect.w && y >= rightSwordRect.y && y <= rightSwordRect.y + rightSwordRect.h) ||
                    (x >= slingshotCannonRect.x && x <= slingshotCannonRect.x + slingshotCannonRect.w && y >= slingshotCannonRect.y && y <= slingshotCannonRect.y + slingshotCannonRect.h)) {
                    
                    playSound(clickSound);
                    stoneProjectile = {
                        startX: slingshotCannonRect.x + 40,
                        startY: slingshotCannonRect.y,
                        targetX: activeHazard.x,
                        targetY: activeHazard.y,
                        progress: 0
                    };
                    return;
                }
            }

            // Bet Slider Click
            let nodes = getBetArcNodes();
            if (Math.hypot(x - nodes[4].x, y - nodes[4].y) <= 22) {
                isBetAllActive = !isBetAllActive;
                currentBet = isBetAllActive ? balance : betSteps[betIndex];
                playSound(clickSound);
                return;
            }

            if (x >= betSliderOvalRect.x && x <= betSliderOvalRect.x + betSliderOvalRect.w && y >= betSliderOvalRect.y && y <= betSliderOvalRect.y + betSliderOvalRect.h) {
                let closest = 0, minD = Infinity;
                nodes.forEach((n, idx) => {
                    let d = Math.hypot(x - n.x, y - n.y);
                    if (d < minD) { minD = d; closest = idx; }
                });
                if (closest < 4 && balance >= betSteps[closest]) {
                    isBetAllActive = false;
                    betIndex = closest;
                    currentBet = betSteps[betIndex];
                    playSound(clickSound);
                }
                return;
            }

            // SPIN TEMPLE Button
            if (!spinning && !isGameOver && x >= spinPlankRect.x && x <= spinPlankRect.x + spinPlankRect.w && y >= spinPlankRect.y && y <= spinPlankRect.y + spinPlankRect.h) {
                if (balance < currentBet) return;
                balance -= currentBet;
                spinning = true;
                hazardActive = false;
                activeHazard = null;
                stoneProjectile = null;
                playSound(spinSound);

                let timer = 0;
                let interval = setInterval(() => {
                    reels = [
                        symbols[Math.floor(Math.random() * symbols.length)],
                        symbols[Math.floor(Math.random() * symbols.length)],
                        symbols[Math.floor(Math.random() * symbols.length)]
                    ];
                    timer += 50;
                    if (timer >= 1000) {
                        clearInterval(interval);
                        spinning = false;

                        let payout = 0;
                        if (reels[0] === reels[1] && reels[1] === reels[2]) {
                            payout = currentBet * 50;
                        } else if (reels[0] === reels[1] || reels[1] === reels[2]) {
                            payout = currentBet * 15;
                        }

                        if (payout > 0) {
                            balance += payout;
                            bannerText = `WIN! +$${payout.toLocaleString()}`;
                            bannerAlpha = 2.0;
                            playSound(winSound);
                            triggerScreenShake(300, 6);
                            for(let i=0; i<35; i++) flowerParticles.push(new FlowerParticle(400, 250));
                        } else {
                            // GUARANTEED HAZARD CHANCE FOR TESTING & PLAYABILITY
                            if (Math.random() < 0.5) {
                                let hazards = ['jaguar', 'vine'];
                                let chosen = hazards[Math.floor(Math.random() * hazards.length)];
                                activeHazard = { type: chosen, x: 400, y: 165 };
                                hazardActive = true;

                                let pct = chosen === 'jaguar' ? 0.01 : 0.05;
                                let penalty = Math.max(500, Math.floor(balance * pct));
                                balance = Math.max(0, balance - penalty);
                                bannerText = `${chosen.toUpperCase()} ATTACK! DEFEND NOW!`;
                                bannerAlpha = 3.5;
                                triggerScreenShake(400, 8);
                            }
                        }

                        if (isBetAllActive) {
                            isBetAllActive = false;
                            currentBet = betSteps[betIndex];
                        }

                        if (balance > highscore) {
                            highscore = balance;
                            localStorage.setItem("jungle_highscore", highscore);
                        }

                        if (balance <= 0) {
                            balance = 0;
                            isGameOver = true;
                            bannerText = "GAME OVER: OUT OF TREASURE";
                            bannerAlpha = 4.0;
                        }
                    }
                }, 50);
                return;
            }

            // RESTART Button
            if (x >= restartWheelRect.x && x <= restartWheelRect.x + restartWheelRect.w && y >= restartWheelRect.y && y <= restartWheelRect.y + restartWheelRect.h) {
                balance = 100000;
                isGameOver = false;
                betIndex = 0;
                currentBet = betSteps[betIndex];
                isBetAllActive = false;
                hazardActive = false;
                activeHazard = null;
                stoneProjectile = null;
                playSound(clickSound);
                return;
            }
        });

        function gameLoop(currentTime) {
            let dt = 1;
            if (screenShakeTimer > 0) screenShakeTimer -= 16.67;

            ctx.save();
            if (screenShakeTimer > 0) {
                let dx = (Math.random() - 0.5) * screenShakeIntensity;
                let dy = (Math.random() - 0.5) * screenShakeIntensity;
                ctx.translate(dx, dy);
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (bgImg.complete && bgImg.naturalWidth !== 0) {
                ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = "#1b4931";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            drawEnvironmentOverlay();

            // Casino Logo Top Left
            ctx.drawImage(shibaImg, logoRect.x, logoRect.y, logoRect.w, logoRect.h);

            // Scoreboards Header (Clear of top controls)
            drawOutlinedText(`Highest Loot  $${highscore.toLocaleString()}`, 95, 28, "18px Arial bold", SOFT_GOLD, DARK_BROWN, "left");
            drawOutlinedText(`Treasure Hunt $${balance.toLocaleString()}`, 95, 55, "20px Arial bold", WHITE, DARK_BROWN, "left");

            // Independent Music Controls (Mute & Slider)
            ctx.fillStyle = "#8b4513"; ctx.strokeStyle = DARK_BROWN; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.roundRect(musicMuteRect.x, musicMuteRect.y, musicMuteRect.w, musicMuteRect.h, 8); ctx.fill(); ctx.stroke();
            ctx.drawImage(musicMuted ? muteImg : speakerImg, musicMuteRect.x + 5, musicMuteRect.y + 5, 25, 25);
            ctx.fillStyle = "#1a0a00"; ctx.fillRect(musicSliderRect.x, musicSliderRect.y + 6, musicSliderRect.w, 4);
            ctx.fillStyle = SOFT_GOLD; ctx.beginPath(); ctx.arc(musicSliderRect.x + (musicVolume * musicSliderRect.w), musicSliderRect.y + 8, 6, 0, Math.PI * 2); ctx.fill();
            drawOutlinedText("MUSIC", musicMuteRect.x + 35, musicMuteRect.y - 8, "9px Arial bold", SOFT_GOLD, DARK_BROWN, "left");

            // Independent SFX Controls (Mute & Slider)
            ctx.fillStyle = "#8b4513"; ctx.strokeStyle = DARK_BROWN; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.roundRect(sfxMuteRect.x, sfxMuteRect.y, sfxMuteRect.w, sfxMuteRect.h, 8); ctx.fill(); ctx.stroke();
            ctx.drawImage(sfxMuted ? muteImg : speakerImg, sfxMuteRect.x + 5, sfxMuteRect.y + 5, 25, 25);
            ctx.fillStyle = "#1a0a00"; ctx.fillRect(sfxSliderRect.x, sfxSliderRect.y + 6, sfxSliderRect.w, 4);
            ctx.fillStyle = SOFT_GOLD; ctx.beginPath(); ctx.arc(sfxSliderRect.x + (sfxVolume * sfxSliderRect.w), sfxSliderRect.y + 8, 6, 0, Math.PI * 2); ctx.fill();
            drawOutlinedText("SFX", sfxMuteRect.x + 35, sfxMuteRect.y - 8, "9px Arial bold", SOFT_GOLD, DARK_BROWN, "left");

            // Time Mode Toggle & Playlist Dropdown
            drawWoodenButton(timeToggleRect, timeModes[timeModeIndex]);

            ctx.fillStyle = "#8b4513"; ctx.strokeStyle = DARK_BROWN; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.roundRect(playlistDropdownRect.x, playlistDropdownRect.y, playlistDropdownRect.w, playlistDropdownRect.h, 12); ctx.fill(); ctx.stroke();
            drawOutlinedText(`🎵 ${trackNames[currentTrackIndex]} ▾`, playlistDropdownRect.x + 80, playlistDropdownRect.y + 16, "11px Arial bold", SOFT_GOLD);

            if (playlistDropdownOpen) {
                ctx.fillStyle = "#1a0a00"; ctx.strokeStyle = SOFT_GOLD; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.roundRect(playlistDropdownRect.x, playlistDropdownRect.y + 35, playlistDropdownRect.w, trackNames.length * 35, 10); ctx.fill(); ctx.stroke();
                trackNames.forEach((name, idx) => {
                    drawOutlinedText(name, playlistDropdownRect.x + 80, playlistDropdownRect.y + 52 + (idx * 35), "11px Arial", idx === currentTrackIndex ? SOFT_GOLD : WHITE);
                });
            }

            // Hazard Threat & Projectile Animation
            drawHazardAndDefenseGraphics();

            // Reels Matrix Display
            const symbolSize = 80;
            const reelStartX = (canvas.width - (3 * symbolSize + 2 * 45)) / 2;
            for (let i = 0; i < 3; i++) {
                ctx.fillStyle = "#d2b48c";
                ctx.strokeStyle = DARK_BROWN;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.roundRect(reelStartX + i * 125, 200, symbolSize, symbolSize, 15);
                ctx.fill();
                ctx.stroke();

                let sym = reels[i];
                if (symbolImages[sym] && symbolImages[sym].complete) {
                    ctx.drawImage(symbolImages[sym], reelStartX + i * 125 + 5, 205, 70, 70);
                }
            }

            // Payline Indicator
            ctx.strokeStyle = "#ff3333";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(reelStartX - 15, 240);
            ctx.lineTo(reelStartX + 3 * symbolSize + 2 * 45 + 15, 240);
            ctx.stroke();

            // Banner Notification Text (Safely positioned to avoid overlap)
            if (bannerAlpha > 0) {
                ctx.save();
                ctx.globalAlpha = Math.min(1.0, bannerAlpha);
                drawOutlinedText(bannerText, canvas.width / 2, 115, "20px Arial bold", SOFT_GOLD, DARK_BROWN);
                ctx.restore();
                bannerAlpha -= 0.008;
            }

            drawPayoutOval();
            drawBetSliderOval();

            // Bottom Controls
            drawWoodenButton(spinPlankRect, isGameOver ? "GAME OVER" : "SPIN TEMPLE");
            drawWoodenButton(restartWheelRect, "Restart", true);

            // Update Flower Particles
            flowerParticles.forEach((fp, idx) => {
                fp.update(dt);
                fp.draw();
                if (fp.alpha <= 0) flowerParticles.splice(idx, 1);
            });

            ctx.restore();
            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
