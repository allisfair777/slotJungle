<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Slot Jungle: Temple Riches</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #050d07;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
            font-family: Arial, sans-serif;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 800px;
            max-height: 600px;
            aspect-ratio: 800 / 600;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border-radius: 30px;
            overflow: hidden;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 30px;
        }
    </style>
</head>
<body>

    <!-- Audio Elements -->
    <audio id="track0" src="jungle_beat1.mp3" loop></audio>
    <audio id="track1" src="jungle_beat2.mp3" loop></audio>
    <audio id="spinSound" src="spin.wav"></audio>
    <audio id="winSound" src="win.wav"></audio>
    <audio id="clickSound" src="click.wav"></audio>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Load Images
        const bgImg = new Image(); bgImg.src = "casino_background.png";
        const shibaImg = new Image(); shibaImg.src = "shiba.png";
        const tigerImg = new Image(); tigerImg.src = "tiger.png";
        const parrotImg = new Image(); parrotImg.src = "parrot.png";
        const monkeyImg = new Image(); monkeyImg.src = "monkey.png";
        const jungleImg = new Image(); jungleImg.src = "jungle.png";
        const speakerImg = new Image(); speakerImg.src = "speaker.png";
        const muteImg = new Image(); muteImg.src = "mute.png";

        const symbols = ["Shiba", "Tiger", "Parrot", "Monkey", "Jungle"];
        const symbolImages = {
            "Shiba": shibaImg,
            "Tiger": tigerImg,
            "Parrot": parrotImg,
            "Monkey": monkeyImg,
            "Jungle": jungleImg
        };

        const SOFT_GOLD = "#d4a373";
        const DARK_BROWN = "#1a0a00";
        const WHITE = "#ffffff";

        let balance = 100000;
        let highscore = parseInt(localStorage.getItem("jungle_highscore")) || 100000;
        
        const betSteps = [1000, 5000, 10000, 25000];
        let betIndex = 0;
        let currentBet = betSteps[betIndex];
        let isBetAllActive = false;
        let isMuted = false;

        // Day / Night Environment System
        const timeModes = ["Day", "Night", "Both"];
        let timeModeIndex = 0;
        let environmentCycle = 0; // 0 = Day, 1 = Night

        let reels = ["Shiba", "Tiger", "Parrot"];
        let spinning = false;
        let isGameOver = false;

        let bannerText = "";
        let bannerAlpha = 0;
        let goldBursts = [];
        let screenShakeTimer = 0;
        let screenShakeIntensity = 0;

        // Hazard State
        let activeHazard = null; // { type: 'jaguar'|'vine'|'quicksand'|'curse', life: 120 }
        let hazardWarningAlpha = 0;

        // Stars & Fireflies for Night Mode
        let stars = [];
        for (let i = 0; i < 40; i++) {
            stars.push({
                x: Math.random() * 800,
                y: Math.random() * 220,
                size: Math.random() * 2 + 1,
                alpha: Math.random(),
                speed: Math.random() * 0.03 + 0.01
            });
        }

        let fireflies = [];
        for (let i = 0; i < 15; i++) {
            fireflies.push({
                x: Math.random() * 800,
                y: Math.random() * 400 + 150,
                vx: (Math.random() - 0.5) * 0.5,
                vy: (Math.random() - 0.5) * 0.5,
                alpha: Math.random()
            });
        }

        // Layout Rectangles (Adjusted to avoid ALL overlapping)
        const payoutOvalRect = { x: 25, y: 310, w: 365, h: 140 };
        const betSliderOvalRect = { x: 410, y: 310, w: 365, h: 140 };
        const spinPlankRect = { x: 550, y: 470, w: 225, h: 65 };
        const restartWheelRect = { x: 25, y: 470, w: 65, h: 65 };
        const muteButtonRect = { x: 715, y: 25, w: 60, h: 60 };
        const timeToggleRect = { x: 25, y: 25, w: 90, h: 40 };

        function playSound(soundObj) {
            if (!isMuted && soundObj && soundObj.src) {
                soundObj.currentTime = 0;
                soundObj.play().catch(e => {});
            }
        }

        function triggerScreenShake(durationMs = 300, intensity = 8) {
            screenShakeTimer = durationMs;
            screenShakeIntensity = intensity;
        }

        class GoldBurstParticle {
            constructor(x, y, isNegative = false) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 3;
                this.vy = -(Math.random() * 2 + 1);
                this.alpha = 1.0;
                this.life = 90;
                this.isNegative = isNegative;
                this.size = Math.random() * 4 + 6;
            }
            update(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                this.life -= dt;
                this.alpha = Math.max(0, this.life / 90);
            }
            draw() {
                if (this.alpha <= 0) return;
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.isNegative ? "#ff4d4d" : "#ffd166";
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function drawOutlinedText(text, x, y, font, fillColor, outlineColor = DARK_BROWN, align = "center") {
            ctx.save();
            ctx.font = font;
            ctx.textAlign = align;
            ctx.textBaseline = "middle";
            ctx.lineWidth = 5;
            ctx.strokeStyle = outlineColor;
            ctx.strokeText(text, x, y);
            ctx.fillStyle = fillColor;
            ctx.fillText(text, x, y);
            ctx.restore();
        }

        function getBetArcNodes() {
            let startX = betSliderOvalRect.x + 35;
            let endX = betSliderOvalRect.x + betSliderOvalRect.w - 50;
            let startY = betSliderOvalRect.y + 98;
            let endY = betSliderOvalRect.y + 28;

            let nodes = [];
            for (let i = 0; i < 5; i++) {
                let t = i / 4;
                let x = startX + t * (endX - startX);
                let linearY = startY + t * (endY - startY);
                let arcLift = Math.sin(t * Math.PI) * 14;
                let y = linearY - arcLift;
                nodes.push({ x, y });
            }
            return nodes;
        }

        function drawEnvironmentOverlay() {
            let mode = timeModes[timeModeIndex];
            let isNight = mode === "Night" || (mode === "Both" && Math.floor(Date.now() / 8000) % 2 === 1);

            if (isNight) {
                // Night sky tint
                let skyGrad = ctx.createLinearGradient(0, 0, 0, 300);
                skyGrad.addColorStop(0, "rgba(5, 12, 35, 0.75)");
                skyGrad.addColorStop(1, "rgba(10, 30, 20, 0.4)");
                ctx.fillStyle = skyGrad;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Render Stars
                stars.forEach(s => {
                    s.alpha += s.speed;
                    if (s.alpha > 1 || s.alpha < 0) s.speed = -s.speed;
                    ctx.fillStyle = `rgba(255, 255, 220, ${Math.abs(s.alpha)})`;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                    ctx.fill();
                });

                // Render Fireflies
                fireflies.forEach(f => {
                    f.x += f.vx;
                    f.y += f.vy;
                    if (f.x < 0 || f.x > 800) f.vx = -f.vx;
                    if (f.y < 150 || f.y > 550) f.vy = -f.vy;
                    ctx.fillStyle = "rgba(180, 255, 100, 0.8)";
                    ctx.beginPath();
                    ctx.arc(f.x, f.y, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                });
            }
        }

        function drawHazardGraphic() {
            if (!activeHazard) return;
            ctx.save();
            let h = activeHazard;
            let cx = 400, cy = 275;

            if (h.type === 'jaguar') {
                // Glowing Jaguar Eyes
                ctx.fillStyle = "#ffcc00";
                ctx.shadowColor = "#ff3300";
                ctx.shadowBlur = 15;
                ctx.beginPath(); ctx.arc(cx - 30, cy - 10, 8, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(cx + 30, cy - 10, 8, 0, Math.PI * 2); ctx.fill();
            } else if (h.type === 'vine') {
                // Venom Vine Tentacles
                ctx.strokeStyle = "#4dff4d";
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.moveTo(cx - 150, cy + 40);
                ctx.quadraticCurveTo(cx - 50, cy - 20, cx, cy + 40);
                ctx.quadraticCurveTo(cx + 50, cy + 80, cx + 150, cy + 40);
                ctx.stroke();
            } else if (h.type === 'quicksand') {
                // Quicksand Swirl
                ctx.strokeStyle = "#d4a373";
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.ellipse(cx, cy + 30, 120, 30, 0, 0, Math.PI * 2);
                ctx.stroke();
            }
            ctx.restore();
        }

        function drawPayoutOval() {
            ctx.save();
            ctx.fillStyle = "rgba(26, 10, 0, 0.82)";
            ctx.strokeStyle = SOFT_GOLD;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(payoutOvalRect.x, payoutOvalRect.y, payoutOvalRect.w, payoutOvalRect.h, 30);
            ctx.fill();
            ctx.stroke();

            drawOutlinedText("Treasures", payoutOvalRect.x + 95, payoutOvalRect.y + 18, "15px Arial bold", SOFT_GOLD);
            drawOutlinedText("Hazards", payoutOvalRect.x + 270, payoutOvalRect.y + 18, "15px Arial bold", SOFT_GOLD);

            let rowY = [
                payoutOvalRect.y + 42,
                payoutOvalRect.y + 66,
                payoutOvalRect.y + 90,
                payoutOvalRect.y + 114
            ];

            ctx.drawImage(shibaImg, payoutOvalRect.x + 20, rowY[0] - 10, 20, 20);
            drawOutlinedText(`$${(currentBet*50).toLocaleString()}`, payoutOvalRect.x + 85, rowY[0], "11px Arial bold", WHITE, DARK_BROWN, "left");

            ctx.drawImage(monkeyImg, payoutOvalRect.x + 20, rowY[1] - 10, 20, 20);
            drawOutlinedText(`$${(currentBet*25).toLocaleString()}`, payoutOvalRect.x + 85, rowY[1], "11px Arial bold", WHITE, DARK_BROWN, "left");

            ctx.drawImage(tigerImg, payoutOvalRect.x + 20, rowY[2] - 10, 20, 20);
            drawOutlinedText(`$${(currentBet*15).toLocaleString()}`, payoutOvalRect.x + 85, rowY[2], "11px Arial bold", WHITE, DARK_BROWN, "left");

            ctx.drawImage(parrotImg, payoutOvalRect.x + 20, rowY[3] - 10, 20, 20);
            drawOutlinedText(`$${(currentBet*10).toLocaleString()}`, payoutOvalRect.x + 85, rowY[3], "11px Arial bold", WHITE, DARK_BROWN, "left");

            let hazX = payoutOvalRect.x + 203;
            drawOutlinedText("Jaguar Trap", hazX + 25, rowY[0], "11px Arial bold", "#ff9999", DARK_BROWN, "left");
            drawOutlinedText("-1%", hazX + 130, rowY[0], "11px Arial bold", "#ff4d4d", DARK_BROWN, "right");

            drawOutlinedText("Venom Vine", hazX + 25, rowY[1], "11px Arial bold", "#ff9999", DARK_BROWN, "left");
            drawOutlinedText("-5%", hazX + 130, rowY[1], "11px Arial bold", "#ff4d4d", DARK_BROWN, "right");

            drawOutlinedText("Quicksand", hazX + 25, rowY[2], "11px Arial bold", "#ff9999", DARK_BROWN, "left");
            drawOutlinedText("-10%", hazX + 130, rowY[2], "11px Arial bold", "#ff4d4d", DARK_BROWN, "right");

            drawOutlinedText("Temple Curse", hazX + 25, rowY[3], "11px Arial bold", "#ff4d4d", DARK_BROWN, "left");
            drawOutlinedText("-15%", hazX + 130, rowY[3], "11px Arial bold", "#ff4d4d", DARK_BROWN, "right");

            ctx.restore();
        }

        function drawBetSliderOval() {
            ctx.save();
            ctx.fillStyle = "rgba(26, 10, 0, 0.82)";
            ctx.strokeStyle = SOFT_GOLD;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(betSliderOvalRect.x, betSliderOvalRect.y, betSliderOvalRect.w, betSliderOvalRect.h, 30);
            ctx.fill();
            ctx.stroke();

            let label = isBetAllActive ? `Bet: ALL ($${currentBet.toLocaleString()})` : `Bet: $${currentBet.toLocaleString()}`;
            drawOutlinedText(label, betSliderOvalRect.x + 180, betSliderOvalRect.y + 22, "15px Arial bold", SOFT_GOLD);

            let nodes = getBetArcNodes();
            betSteps.forEach((val, idx) => {
                let node = nodes[idx];
                let isSelected = (idx === betIndex) && !isBetAllActive;
                let displayVal = val >= 1000000 ? `$${val/1000000}M` : `$${val/1000}k`;
                drawOutlinedText(displayVal, node.x, node.y + 22, "11px Arial bold", isSelected ? SOFT_GOLD : "#aaa");

                ctx.save();
                if (!isSelected) ctx.globalAlpha = 0.5;
                ctx.drawImage(shibaImg, node.x - 14, node.y - 14, 28, 28);
                ctx.restore();
            });

            // Bet All Coin
            let coin = nodes[4];
            ctx.fillStyle = isBetAllActive ? "#ffd166" : "#3d3023";
            ctx.strokeStyle = isBetAllActive ? "#fff" : SOFT_GOLD;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(coin.x, coin.y, 20, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            drawOutlinedText("ALL", coin.x, coin.y, "11px Arial bold", DARK_BROWN, SOFT_GOLD);
            drawOutlinedText("Bet All", coin.x, coin.y + 26, "10px Arial bold", isBetAllActive ? SOFT_GOLD : "#aaa");

            ctx.restore();
        }

        function drawWoodenButton(rect, text, isCircle = false) {
            ctx.save();
            ctx.fillStyle = "#8b4513";
            ctx.strokeStyle = DARK_BROWN;
            ctx.lineWidth = 3;

            if (isCircle) {
                let radius = rect.w / 2;
                ctx.beginPath();
                ctx.arc(rect.x + radius, rect.y + radius, radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                drawOutlinedText(text, rect.x + radius, rect.y + radius, "13px Arial bold", SOFT_GOLD);
            } else {
                ctx.beginPath();
                ctx.roundRect(rect.x, rect.y, rect.w, rect.h, 15);
                ctx.fill();
                ctx.stroke();
                drawOutlinedText(text, rect.x + rect.w / 2, rect.y + rect.h / 2, "18px Arial bold", SOFT_GOLD);
            }
            ctx.restore();
        }

        canvas.addEventListener("pointerdown", (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) * (canvas.width / rect.width);
            const y = (e.clientY - rect.top) * (canvas.height / rect.height);

            // Day/Night Toggle
            if (x >= timeToggleRect.x && x <= timeToggleRect.x + timeToggleRect.w && y >= timeToggleRect.y && y <= timeToggleRect.y + timeToggleRect.h) {
                timeModeIndex = (timeModeIndex + 1) % timeModes.length;
                playSound(clickSound);
                return;
            }

            // Wooden Mute Button
            if (x >= muteButtonRect.x && x <= muteButtonRect.x + muteButtonRect.w && y >= muteButtonRect.y && y <= muteButtonRect.y + muteButtonRect.h) {
                isMuted = !isMuted;
                playSound(clickSound);
                return;
            }

            // Bet Slider Click
            let nodes = getBetArcNodes();
            if (Math.hypot(x - nodes[4].x, y - nodes[4].y) <= 22) {
                isBetAllActive = !isBetAllActive;
                currentBet = isBetAllActive ? balance : betSteps[betIndex];
                playSound(clickSound);
                return;
            }

            if (x >= betSliderOvalRect.x && x <= betSliderOvalRect.x + betSliderOvalRect.w && y >= betSliderOvalRect.y && y <= betSliderOvalRect.y + betSliderOvalRect.h) {
                let closest = 0, minD = Infinity;
                nodes.forEach((n, idx) => {
                    let d = Math.hypot(x - n.x, y - n.y);
                    if (d < minD) { minD = d; closest = idx; }
                });
                if (closest < 4 && balance >= betSteps[closest]) {
                    isBetAllActive = false;
                    betIndex = closest;
                    currentBet = betSteps[betIndex];
                    playSound(clickSound);
                }
                return;
            }

            // SPIN TEMPLE Button
            if (!spinning && !isGameOver && x >= spinPlankRect.x && x <= spinPlankRect.x + spinPlankRect.w && y >= spinPlankRect.y && y <= spinPlankRect.y + spinPlankRect.h) {
                if (balance < currentBet) return;
                balance -= currentBet;
                spinning = true;
                activeHazard = null;
                playSound(spinSound);

                let timer = 0;
                let interval = setInterval(() => {
                    reels = [
                        symbols[Math.floor(Math.random() * symbols.length)],
                        symbols[Math.floor(Math.random() * symbols.length)],
                        symbols[Math.floor(Math.random() * symbols.length)]
                    ];
                    timer += 50;
                    if (timer >= 1000) {
                        clearInterval(interval);
                        spinning = false;

                        let payout = 0;
                        if (reels[0] === reels[1] && reels[1] === reels[2]) {
                            payout = currentBet * 50;
                        } else if (reels[0] === reels[1] || reels[1] === reels[2]) {
                            payout = currentBet * 15;
                        }

                        if (payout > 0) {
                            balance += payout;
                            bannerText = `WIN! +$${payout.toLocaleString()}`;
                            bannerAlpha = 2.0;
                            playSound(winSound);
                            triggerScreenShake(300, 6);
                            for(let i=0; i<30; i++) goldBursts.push(new GoldBurstParticle(400, 250, false));
                        } else {
                            // Hazard Trigger Logic
                            if (Math.random() < 0.3) {
                                let hazards = ['jaguar', 'vine', 'quicksand', 'curse'];
                                let chosen = hazards[Math.floor(Math.random() * hazards.length)];
                                activeHazard = { type: chosen, life: 120 };

                                let pct = chosen === 'jaguar' ? 0.01 : (chosen === 'vine' ? 0.05 : (chosen === 'quicksand' ? 0.10 : 0.15));
                                let penalty = Math.max(500, Math.floor(balance * pct));
                                balance = Math.max(0, balance - penalty);
                                bannerText = `${chosen.toUpperCase()} ATTACK! -$${penalty.toLocaleString()}`;
                                bannerAlpha = 2.5;
                                triggerScreenShake(400, 8);
                                for(let i=0; i<20; i++) goldBursts.push(new GoldBurstParticle(400, 250, true));
                            }
                        }

                        if (isBetAllActive) {
                            isBetAllActive = false;
                            currentBet = betSteps[betIndex];
                        }

                        if (balance > highscore) {
                            highscore = balance;
                            localStorage.setItem("jungle_highscore", highscore);
                        }

                        if (balance <= 0) {
                            balance = 0;
                            isGameOver = true;
                            bannerText = "GAME OVER: OUT OF TREASURE";
                            bannerAlpha = 4.0;
                        }
                    }
                }, 50);
                return;
            }

            // RESTART Button
            if (x >= restartWheelRect.x && x <= restartWheelRect.x + restartWheelRect.w && y >= restartWheelRect.y && y <= restartWheelRect.y + restartWheelRect.h) {
                balance = 100000;
                isGameOver = false;
                betIndex = 0;
                currentBet = betSteps[betIndex];
                isBetAllActive = false;
                activeHazard = null;
                playSound(clickSound);
                return;
            }
        });

        function gameLoop(currentTime) {
            let dt = 1;
            if (screenShakeTimer > 0) screenShakeTimer -= 16.67;

            ctx.save();
            if (screenShakeTimer > 0) {
                let dx = (Math.random() - 0.5) * screenShakeIntensity;
                let dy = (Math.random() - 0.5) * screenShakeIntensity;
                ctx.translate(dx, dy);
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Base Background Image
            if (bgImg.complete && bgImg.naturalWidth !== 0) {
                ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = "#1b4931";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            drawEnvironmentOverlay();

            // Scoreboards Header
            ctx.drawImage(shibaImg, 180, 15, 55, 55);
            drawOutlinedText(`Highest Loot  $${highscore.toLocaleString()}`, 300, 32, "19px Arial bold", SOFT_GOLD, DARK_BROWN, "left");
            drawOutlinedText(`Treasure Hunt $${balance.toLocaleString()}`, 300, 62, "21px Arial bold", WHITE, DARK_BROWN, "left");

            // Time Mode Toggle Button (Top Left)
            drawWoodenButton(timeToggleRect, timeModes[timeModeIndex]);

            // Wooden Audio Mute Button (Top Right)
            ctx.fillStyle = "#8b4513";
            ctx.strokeStyle = DARK_BROWN;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(muteButtonRect.x + 30, muteButtonRect.y + 30, 28, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            let activeIcon = isMuted ? muteImg : speakerImg;
            if (activeIcon.complete && activeIcon.naturalWidth !== 0) {
                ctx.drawImage(activeIcon, muteButtonRect.x + 15, muteButtonRect.y + 15, 30, 30);
            }

            // Hazard Graphics Rendering
            drawHazardGraphic();

            // Reels Matrix Display
            const symbolSize = 80;
            const reelStartX = (canvas.width - (3 * symbolSize + 2 * 45)) / 2;
            for (let i = 0; i < 3; i++) {
                ctx.fillStyle = "#d2b48c";
                ctx.strokeStyle = DARK_BROWN;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.roundRect(reelStartX + i * 125, 215, symbolSize, symbolSize, 15);
                ctx.fill();
                ctx.stroke();

                let sym = reels[i];
                if (symbolImages[sym] && symbolImages[sym].complete) {
                    ctx.drawImage(symbolImages[sym], reelStartX + i * 125 + 5, 220, 70, 70);
                }
            }

            // Payline Indicator
            ctx.strokeStyle = "#ff3333";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(reelStartX - 15, 255);
            ctx.lineTo(reelStartX + 3 * symbolSize + 2 * 45 + 15, 255);
            ctx.stroke();

            // Banner Notification Text
            if (bannerAlpha > 0) {
                ctx.save();
                ctx.globalAlpha = Math.min(1.0, bannerAlpha);
                drawOutlinedText(bannerText, canvas.width / 2, 175, "22px Arial bold", SOFT_GOLD, DARK_BROWN);
                ctx.restore();
                bannerAlpha -= 0.008;
            }

            drawPayoutOval();
            drawBetSliderOval();

            // Bottom Buttons (Separated with zero overlap)
            drawWoodenButton(spinPlankRect, isGameOver ? "GAME OVER" : "SPIN TEMPLE");
            drawWoodenButton(restartWheelRect, "Restart", true);

            goldBursts.forEach((gb, idx) => {
                gb.update(dt);
                gb.draw();
                if (gb.alpha <= 0) goldBursts.splice(idx, 1);
            });

            ctx.restore();
            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
