<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Slot Jungle: Temple Riches</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #0b1a0f;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
            font-family: Arial, sans-serif;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 800px;
            max-height: 600px;
            aspect-ratio: 800 / 600;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border-radius: 30px;
            overflow: hidden;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 30px;
        }
    </style>
</head>
<body>

    <!-- Audio Elements -->
    <audio id="track0" src="jungle_beat1.mp3" loop></audio>
    <audio id="track1" src="jungle_beat2.mp3" loop></audio>
    <audio id="spinSound" src="spin.wav"></audio>
    <audio id="winSound" src="win.wav"></audio>
    <audio id="clickSound" src="click.wav"></audio>
    <audio id="quitSound" src="quit.wav"></audio>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Load Images
        const bgImg = new Image(); bgImg.src = "casino_background.png";
        const shibaImg = new Image(); shibaImg.src = "shiba.png";
        const tigerImg = new Image(); tigerImg.src = "tiger.png";
        const parrotImg = new Image(); parrotImg.src = "parrot.png";
        const monkeyImg = new Image(); monkeyImg.src = "monkey.png";
        const jungleImg = new Image(); jungleImg.src = "jungle.png";
        const speakerImg = new Image(); speakerImg.src = "speaker.png";
        const muteImg = new Image(); muteImg.src = "mute.png";

        const symbols = ["Shiba", "Tiger", "Parrot", "Monkey", "Jungle"];
        const symbolImages = {
            "Shiba": shibaImg,
            "Tiger": tigerImg,
            "Parrot": parrotImg,
            "Monkey": monkeyImg,
            "Jungle": jungleImg
        };

        const SOFT_GOLD = "#d4a373";
        const DARK_BROWN = "#1a0a00";
        const WHITE = "#ffffff";

        let balance = 100000;
        let highscore = parseInt(localStorage.getItem("jungle_highscore")) || 100000;
        
        const betSteps = [1000, 5000, 10000, 25000];
        let betIndex = 0;
        let currentBet = betSteps[betIndex];
        let isBetAllActive = false;
        
        let musicStepIndex = 0;
        let sfxStepIndex = 1;
        let currentTrackIndex = 0;
        const soundtracks = [document.getElementById("track0"), document.getElementById("track1")];
        const trackNames = ["Jungle Beats Vol. 1", "Rainforest Rhythms"];

        let reels = ["Shiba", "Tiger", "Parrot"];
        let spinning = false;
        let isGameOver = false;

        let floatingTexts = [];
        let bannerText = "";
        let bannerAlpha = 0;
        let goldBursts = [];
        let screenShakeTimer = 0;
        let screenShakeIntensity = 0;
        let mouseX = 400, mouseY = 300;

        // UI Rectangles
        const spinPlankRect = { x: 575, y: 460, w: 200, h: 70 };
        const restartWheelRect = { x: 100, y: 460, w: 70, h: 70 };
        const payoutOvalRect = { x: 25, y: 325, w: 365, h: 142 };
        const betSliderOvalRect = { x: 410, y: 325, w: 365, h: 142 };
        const speakerIconRect = { x: 670, y: 35, w: 80, h: 80 };

        function playSound(soundObj) {
            if (sfxStepIndex > 0 && soundObj && soundObj.src) {
                soundObj.currentTime = 0;
                soundObj.play().catch(e => {});
            }
        }

        function triggerScreenShake(durationMs = 300, intensity = 8) {
            screenShakeDuration = durationMs;
            screenShakeTimer = durationMs;
            screenShakeIntensity = intensity;
        }

        class FloatingPayoutText {
            constructor(text, x, y, isNegative = false) {
                this.text = text;
                this.x = x;
                this.y = y;
                this.vy = -1.0;
                this.alpha = 1.0;
                this.life = 80;
                this.isNegative = isNegative;
            }
            update(dt) {
                this.y += this.vy * dt;
                this.life -= dt;
                if (this.life < 30) this.alpha = Math.max(0, this.life / 30);
            }
            draw() {
                if (this.alpha <= 0) return;
                ctx.save();
                ctx.globalAlpha = this.alpha;
                let color = this.isNegative ? "#ff4d4d" : SOFT_GOLD;
                drawOutlinedText(this.text, this.x, this.y, "22px Arial bold", color, DARK_BROWN, "center");
                ctx.restore();
            }
        }

        class GoldBurstParticle {
            constructor(x, y, isNegative = false) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = -(Math.random() * 1.5 + 0.5);
                this.alpha = 1.0;
                this.life = 90;
                this.isNegative = isNegative;
                this.size = Math.random() * 4 + 8;
            }
            update(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                this.life -= dt;
                this.alpha = Math.max(0, this.life / 90);
            }
            draw() {
                if (this.alpha <= 0) return;
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.isNegative ? "#ff4d4d" : "#ffd166";
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function drawOutlinedText(text, x, y, font, fillColor, outlineColor = DARK_BROWN, align = "center") {
            ctx.save();
            ctx.font = font;
            ctx.textAlign = align;
            ctx.textBaseline = "middle";
            ctx.lineWidth = 5;
            ctx.strokeStyle = outlineColor;
            ctx.strokeText(text, x, y);
            ctx.fillStyle = fillColor;
            ctx.fillText(text, x, y);
            ctx.restore();
        }

        function getBetArcNodes() {
            let startX = betSliderOvalRect.x + 35;
            let endX = betSliderOvalRect.x + betSliderOvalRect.w - 50;
            let startY = betSliderOvalRect.y + 98;
            let endY = betSliderOvalRect.y + 28;

            let nodes = [];
            for (let i = 0; i < 5; i++) {
                let t = i / 4;
                let x = startX + t * (endX - startX);
                let linearY = startY + t * (endY - startY);
                let arcLift = Math.sin(t * Math.PI) * 14;
                let y = linearY - arcLift;
                nodes.push({ x, y });
            }
            return nodes;
        }

        function drawPayoutOval() {
            ctx.save();
            ctx.fillStyle = "rgba(26, 10, 0, 0.75)";
            ctx.strokeStyle = SOFT_GOLD;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(payoutOvalRect.x, payoutOvalRect.y, payoutOvalRect.w, payoutOvalRect.h, 35);
            ctx.fill();
            ctx.stroke();

            drawOutlinedText("Treasures", payoutOvalRect.x + 95, payoutOvalRect.y + 18, "15px Arial bold", SOFT_GOLD);
            drawOutlinedText("Hazards", payoutOvalRect.x + 270, payoutOvalRect.y + 18, "15px Arial bold", SOFT_GOLD);

            let prizeAmount = currentBet * 25;
            let rowY = [
                payoutOvalRect.y + 45,
                payoutOvalRect.y + 70,
                payoutOvalRect.y + 95,
                payoutOvalRect.y + 120
            ];

            ctx.drawImage(shibaImg, payoutOvalRect.x + 20, rowY[0] - 10, 20, 20);
            drawOutlinedText(`$${(currentBet*50).toLocaleString()}`, payoutOvalRect.x + 85, rowY[0], "11px Arial bold", WHITE, DARK_BROWN, "left");

            ctx.drawImage(monkeyImg, payoutOvalRect.x + 20, rowY[1] - 10, 20, 20);
            drawOutlinedText(`$${(currentBet*25).toLocaleString()}`, payoutOvalRect.x + 85, rowY[1], "11px Arial bold", WHITE, DARK_BROWN, "left");

            ctx.drawImage(tigerImg, payoutOvalRect.x + 20, rowY[2] - 10, 20, 20);
            drawOutlinedText(`$${(currentBet*15).toLocaleString()}`, payoutOvalRect.x + 85, rowY[2], "11px Arial bold", WHITE, DARK_BROWN, "left");

            ctx.drawImage(parrotImg, payoutOvalRect.x + 20, rowY[3] - 10, 20, 20);
            drawOutlinedText(`$${(currentBet*10).toLocaleString()}`, payoutOvalRect.x + 85, rowY[3], "11px Arial bold", WHITE, DARK_BROWN, "left");

            let hazX = payoutOvalRect.x + 203;
            drawOutlinedText("Jaguar Trap", hazX + 33, rowY[0], "11px Arial bold", "#ff9999", DARK_BROWN, "left");
            drawOutlinedText("-1%", hazX + 132, rowY[0], "11px Arial bold", "#ff4d4d", DARK_BROWN, "right");

            drawOutlinedText("Venom Vine", hazX + 33, rowY[1], "11px Arial bold", "#ff9999", DARK_BROWN, "left");
            drawOutlinedText("-5%", hazX + 132, rowY[1], "11px Arial bold", "#ff4d4d", DARK_BROWN, "right");

            drawOutlinedText("Quicksand", hazX + 33, rowY[2], "11px Arial bold", "#ff9999", DARK_BROWN, "left");
            drawOutlinedText("-10%", hazX + 132, rowY[2], "11px Arial bold", "#ff4d4d", DARK_BROWN, "right");

            drawOutlinedText("Temple Curse", hazX + 33, rowY[3], "11px Arial bold", "#ff4d4d", DARK_BROWN, "left");
            drawOutlinedText("-15%", hazX + 132, rowY[3], "11px Arial bold", "#ff4d4d", DARK_BROWN, "right");

            ctx.restore();
        }

        function drawBetSliderOval() {
            ctx.save();
            ctx.fillStyle = "rgba(26, 10, 0, 0.8)";
            ctx.strokeStyle = SOFT_GOLD;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(betSliderOvalRect.x, betSliderOvalRect.y, betSliderOvalRect.w, betSliderOvalRect.h, 35);
            ctx.fill();
            ctx.stroke();

            let label = isBetAllActive ? `Bet: ALL ($${currentBet.toLocaleString()})` : `Bet: $${currentBet.toLocaleString()}`;
            drawOutlinedText(label, betSliderOvalRect.x + 95, betSliderOvalRect.y + 22, "16px Arial bold", SOFT_GOLD);

            let nodes = getBetArcNodes();
            betSteps.forEach((val, idx) => {
                let node = nodes[idx];
                let isSelected = (idx === betIndex) && !isBetAllActive;
                let displayVal = val >= 1000000 ? `$${val/1000000}M` : `$${val/1000}k`;
                drawOutlinedText(displayVal, node.x, node.y + 22, "11px Arial bold", isSelected ? SOFT_GOLD : "#aaa");

                ctx.save();
                if (!isSelected) ctx.globalAlpha = 0.5;
                ctx.drawImage(shibaImg, node.x - 14, node.y - 14, 28, 28);
                ctx.restore();
            });

            // Bet All Coin
            let coin = nodes[4];
            ctx.fillStyle = isBetAllActive ? "#ffd166" : "#3d3023";
            ctx.strokeStyle = isBetAllActive ? "#fff" : SOFT_GOLD;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(coin.x, coin.y, 20, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            drawOutlinedText("ALL", coin.x, coin.y, "11px Arial bold", DARK_BROWN, SOFT_GOLD);
            drawOutlinedText("Bet All", coin.x, coin.y + 26, "10px Arial bold", isBetAllActive ? SOFT_GOLD : "#aaa");

            ctx.restore();
        }

        canvas.addEventListener("mousemove", (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
            mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);
        });

        canvas.addEventListener("pointerdown", (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) * (canvas.width / rect.width);
            const y = (e.clientY - rect.top) * (canvas.height / rect.height);

            // Mute / Speaker
            if (x >= speakerIconRect.x && x <= speakerIconRect.x + speakerIconRect.w && y >= speakerIconRect.y && y <= speakerIconRect.y + speakerIconRect.h) {
                sfxStepIndex = sfxStepIndex > 0 ? 0 : 1;
                playSound(clickSound);
                return;
            }

            // Bet Slider Click
            let nodes = getBetArcNodes();
            if (Math.hypot(x - nodes[4].x, y - nodes[4].y) <= 22) {
                isBetAllActive = !isBetAllActive;
                currentBet = isBetAllActive ? balance : betSteps[betIndex];
                playSound(clickSound);
                return;
            }

            if (x >= betSliderOvalRect.x && x <= betSliderOvalRect.x + betSliderOvalRect.w && y >= betSliderOvalRect.y && y <= betSliderOvalRect.y + betSliderOvalRect.h) {
                let closest = 0, minD = Infinity;
                nodes.forEach((n, idx) => {
                    let d = Math.hypot(x - n.x, y - n.y);
                    if (d < minD) { minD = d; closest = idx; }
                });
                if (closest < 4 && balance >= betSteps[closest]) {
                    isBetAllActive = false;
                    betIndex = closest;
                    currentBet = betSteps[betIndex];
                    playSound(clickSound);
                }
                return;
            }

            // Spin Button (Hoist / Spin)
            if (!spinning && !isGameOver && x >= spinPlankRect.x && x <= spinPlankRect.x + spinPlankRect.w && y >= spinPlankRect.y && y <= spinPlankRect.y + spinPlankRect.h) {
                if (balance < currentBet) return;
                balance -= currentBet;
                spinning = true;
                playSound(spinSound);

                let timer = 0;
                let interval = setInterval(() => {
                    reels = [
                        symbols[Math.floor(Math.random() * symbols.length)],
                        symbols[Math.floor(Math.random() * symbols.length)],
                        symbols[Math.floor(Math.random() * symbols.length)]
                    ];
                    timer += 50;
                    if (timer >= 1000) {
                        clearInterval(interval);
                        spinning = false;

                        let payout = 0;
                        if (reels[0] === reels[1] && reels[1] === reels[2]) {
                            payout = currentBet * 50;
                        } else if (reels[0] === reels[1] || reels[1] === reels[2]) {
                            payout = currentBet * 15;
                        }

                        if (payout > 0) {
                            balance += payout;
                            bannerText = `WIN! +$${payout.toLocaleString()}`;
                            bannerAlpha = 2.0;
                            playSound(winSound);
                            triggerScreenShake(300, 6);
                            for(let i=0; i<30; i++) goldBursts.push(new GoldBurstParticle(400, 250, false));
                        } else {
                            // Random minor hazard trigger chance
                            if (Math.random() < 0.25) {
                                let penalty = Math.max(500, Math.floor(balance * 0.05));
                                balance = Math.max(0, balance - penalty);
                                bannerText = `Jungle Trap! -$${penalty.toLocaleString()}`;
                                bannerAlpha = 2.0;
                                triggerScreenShake(400, 8);
                                for(let i=0; i<20; i++) goldBursts.push(new GoldBurstParticle(400, 250, true));
                            }
                        }

                        if (isBetAllActive) {
                            isBetAllActive = false;
                            currentBet = betSteps[betIndex];
                        }

                        if (balance > highscore) {
                            highscore = balance;
                            localStorage.setItem("jungle_highscore", highscore);
                        }

                        if (balance <= 0) {
                            balance = 0;
                            isGameOver = true;
                            bannerText = "GAME OVER: OUT OF TREASURE";
                            bannerAlpha = 4.0;
                        }
                    }
                }, 50);
                return;
            }

            // Cash Out Button
            if (x >= 575 && x <= 775 && y >= 20 && y <= 70) {
                playSound(quitSound);
                alert(`Cashed Out Successfully! Banked Balance: $${balance.toLocaleString()}`);
                if (balance > highscore) highscore = balance;
                localStorage.setItem("jungle_highscore", highscore);
                return;
            }

            // Restart Wheel
            if (x >= restartWheelRect.x && x <= restartWheelRect.x + restartWheelRect.w && y >= restartWheelRect.y && y <= restartWheelRect.y + restartWheelRect.h) {
                balance = 100000;
                isGameOver = false;
                betIndex = 0;
                currentBet = betSteps[betIndex];
                isBetAllActive = false;
                playSound(clickSound);
                return;
            }
        });

        function gameLoop(currentTime) {
            let dt = 1;
            if (screenShakeTimer > 0) screenShakeTimer -= 16.67;

            ctx.save();
            if (screenShakeTimer > 0) {
                let dx = (Math.random() - 0.5) * screenShakeIntensity;
                let dy = (Math.random() - 0.5) * screenShakeIntensity;
                ctx.translate(dx, dy);
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (bgImg.complete && bgImg.naturalWidth !== 0) {
                ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = "#1b4931";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // Scoreboards
            ctx.drawImage(shibaImg, 160, 20, 60, 60);
            drawOutlinedText(`Highest Loot  $${highscore.toLocaleString()}`, 290, 42, "20px Arial bold", SOFT_GOLD, DARK_BROWN, "left");
            drawOutlinedText(`Treasure Hunt $${balance.toLocaleString()}`, 290, 75, "22px Arial bold", WHITE, DARK_BROWN, "left");

            // Reels Matrix Display
            const symbolSize = 80;
            const reelStartX = (canvas.width - (3 * symbolSize + 2 * 45)) / 2;
            for (let i = 0; i < 3; i++) {
                ctx.fillStyle = "#d2b48c";
                ctx.strokeStyle = DARK_BROWN;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.roundRect(reelStartX + i * 125, 238, symbolSize, symbolSize, 15);
                ctx.fill();
                ctx.stroke();

                let sym = reels[i];
                if (symbolImages[sym] && symbolImages[sym].complete) {
                    ctx.drawImage(symbolImages[sym], reelStartX + i * 125 + 5, 243, 70, 70);
                }
            }

            // Payline Indicator
            ctx.strokeStyle = "#ff3333";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(reelStartX - 15, 278);
            ctx.lineTo(reelStartX + 3 * symbolSize + 2 * 45 + 15, 278);
            ctx.stroke();

            // Banner Notification
            if (bannerAlpha > 0) {
                ctx.save();
                ctx.globalAlpha = Math.min(1.0, bannerAlpha);
                drawOutlinedText(bannerText, canvas.width / 2, 195, "22px Arial bold", SOFT_GOLD, DARK_BROWN);
                ctx.restore();
                bannerAlpha -= 0.008;
            }

            // Spin Plank & Restart Wheel
            ctx.fillStyle = "#8b4513";
            ctx.strokeStyle = DARK_BROWN;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.roundRect(spinPlankRect.x, spinPlankRect.y, spinPlankRect.w, spinPlankRect.h, 15);
            ctx.fill();
            ctx.stroke();
            drawOutlinedText(isGameOver ? "GAME OVER" : "SPIN TEMPLE", spinPlankRect.x + spinPlankRect.w/2, spinPlankRect.y + spinPlankRect.h/2, "18px Arial bold", SOFT_GOLD);

            ctx.beginPath();
            ctx.arc(restartWheelRect.x + 35, restartWheelRect.y + 35, 32, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            drawOutlinedText("Reset", restartWheelRect.x + 35, restartWheelRect.y + 35, "13px Arial bold", SOFT_GOLD);

            // Cash Out Button
            ctx.beginPath();
            ctx.roundRect(575, 20, 200, 50, 12);
            ctx.fill();
            ctx.stroke();
            drawOutlinedText("CASH OUT", 675, 45, "16px Arial bold", SOFT_GOLD);

            // Audio Speaker Icon
            ctx.drawImage(sfxStepIndex > 0 ? speakerImg : muteImg, speakerIconRect.x, speakerIconRect.y, 60, 60);

            drawPayoutOval();
            drawBetSliderOval();

            goldBursts.forEach((gb, idx) => {
                gb.update(dt);
                gb.draw();
                if (gb.alpha <= 0) goldBursts.splice(idx, 1);
            });

            ctx.restore();
            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
